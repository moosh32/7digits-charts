<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7-DIGITS Charts — גרפים למניות ארה״ב</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" dir="ltr">7-DIGITS</span>
    <span class="brand-sub">גרפים למניות ארה״ב</span>
  </div>
  <div class="search-wrap">
    <input id="symbol-search" type="text" placeholder="חיפוש מניה… (לדוגמה: NVDA)" autocomplete="off" spellcheck="false">
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <div class="topbar-scroll">
  <nav class="timeframes" id="timeframes">
    <button data-tf="1">דקה</button>
    <button data-tf="5">5 דק׳</button>
    <button data-tf="15">15 דק׳</button>
    <button data-tf="30">30 דק׳</button>
    <button data-tf="60">שעה</button>
    <button data-tf="D" class="active">יומי</button>
    <button data-tf="W">שבועי</button>
    <button data-tf="M">חודשי</button>
  </nav>
  <div class="chart-count" id="chart-count" role="group" aria-label="מספר גרפים">
    <button data-layout="1" class="active">גרף אחד</button>
    <button data-layout="2h">שני גרפים</button>
  </div>
  <button id="sync-toggle" class="hdr-btn" title="כשפעיל — שינוי סימבול מחליף את הסימבול בכל הגרפים">סנכרון: כבוי</button>
  <button id="watchlist-toggle" class="hdr-btn">רשימת מעקב</button>
  <button id="pine-toggle" class="hdr-btn">Pine Script</button>
  <button id="scans-toggle" class="hdr-btn">סורקים</button>
  <button id="breadth-toggle" class="hdr-btn">רוחב שוק</button>
  <div class="current-symbol" id="current-symbol">SPY</div>
  </div>
</header>
<aside id="watchlist-panel" class="drawer" hidden>
  <div class="drawer-head"><h2>רשימת מעקב</h2><button class="drawer-close" data-close="watchlist-panel">✕</button></div>
  <button id="watchlist-add" class="drawer-action">＋ הוסף את <span id="watchlist-current" dir="ltr">SPY</span></button>
  <div id="wl-sync" class="wl-sync" hidden></div>
  <div class="wl-tools">
    <div class="wl-filters" id="wl-filters"></div>
    <button id="wl-sort" class="hdr-btn wl-sort-btn">מיון: סימבול</button>
  </div>
  <div id="watchlist-items" class="watchlist-items"></div>
</aside>
<div class="wl-ctx" id="wl-ctx" hidden></div>
<aside id="scans-panel" class="drawer drawer-wide" hidden>
  <div class="drawer-head"><h2>סורקים</h2><button class="drawer-close" data-close="scans-panel">✕</button></div>
  <div id="scan-groups" class="scan-groups"></div>
  <div id="scan-list" class="scan-list"></div>
  <div id="scan-meta" class="scan-meta" hidden></div>
  <div id="scan-results" class="scan-results"></div>
</aside>
<aside id="breadth-panel" class="drawer drawer-wide" hidden>
  <div class="drawer-head"><h2>רוחב שוק</h2><button class="drawer-close" data-close="breadth-panel">✕</button></div>
  <div class="br-tools">
    <div class="br-exch">
      <button data-ex="nasdaq" class="br-exbtn active">נאסד&quot;ק</button>
      <button data-ex="nyse" class="br-exbtn">NYSE</button>
    </div>
    <div class="br-mode">
      <button data-mode="ad" class="br-modebtn active">A/D</button>
      <button data-mode="dual" class="br-modebtn">A/D + מדד</button>
    </div>
    <div class="br-updated" id="br-updated"></div>
  </div>
  <div class="br-legend" id="br-legend"></div>
  <div class="br-stats" id="br-stats"></div>
  <div class="br-chart" id="br-chart"></div>
  <div class="br-note">קו A/D מצטבר — צבירה יומית של עולות פחות יורדות. מקור הנתונים: TradingView, מתעדכן פעם ביום.</div>
</aside>
<aside id="pine-panel" class="drawer drawer-wide" hidden>
  <div class="drawer-head"><h2>Pine Script</h2><button class="drawer-close" data-close="pine-panel">✕</button></div>
  <textarea id="pine-code" dir="ltr" spellcheck="false"></textarea>
  <div class="pine-actions">
    <button id="pine-run" class="btn-primary">הרץ על הגרף</button>
    <button id="pine-preset-ma" class="hdr-btn">ממוצעים</button>
    <button id="pine-preset-vol" class="hdr-btn">ווליום</button>
    <button id="pine-preset-rvol" class="hdr-btn">RVOL 30%</button>
    <button id="pine-save" class="hdr-btn">שמור</button>
    <button id="pine-clear" class="hdr-btn">נקה מהגרף</button>
  </div>
  <div class="pine-settings">
    <label><input type="checkbox" id="pine-markers" checked> הצג סימנים על הגרף</label>
  </div>
  <div id="pine-error" class="pine-error" dir="ltr" hidden></div>
  <div class="pine-saved">
    <h3>לייאאוטים</h3>
    <div class="layout-add">
      <input id="layout-name" placeholder="שם הלייאאוט…" maxlength="40">
      <button id="layout-save" class="hdr-btn">שמור נוכחי</button>
    </div>
    <div id="layout-list"></div>
  </div>
  <div class="pine-saved">
    <h3>הסקריפטים שלי</h3>
    <div id="pine-saved-list"></div>
  </div>
</aside>
<main id="chart"></main>
<script type="module" src="./app.js"></script>
</body>
</html>
