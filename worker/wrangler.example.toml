# 7D Charts — Cloudflare Worker config (EXAMPLE — copy to wrangler.toml and fill in).
# Deploy with: wrangler deploy
#
# Prerequisites (one time):
#   wrangler kv namespace create SEVEND_KV
#   wrangler secret put API_SECRET        # single-user bearer token (never commit it)
#   # optional market-data fallback key:
#   wrangler secret put TWELVEDATA_KEY

name = "sevend-charts"
main = "worker/index.mjs"
compatibility_date = "2026-10-01"

# Static assets: the frontend build plus the data files the worker fetches
# from its own origin on cold start:
#   <assets>/data/scan-snapshot.json   (built by server/scans/snapshot.mjs)
#   <assets>/data/universe.json        (copy of server/universe.json)
# worker-assets/ in this repo is a ready-made example of that layout.
[assets]
directory = "worker-assets"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "SEVEND_KV"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Public (non-secret) vars go here. API_SECRET and TWELVEDATA_KEY must be set
# via `wrangler secret put` — never in this file.
ENV_NAME = "production"
